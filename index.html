<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Platform Farmakokinetik - Tim Dyimzy</title>
    <link rel="icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f48a.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0e1117;
        }
        .app-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: calc(100% + 50px);
            height: calc(100dvh + 50px);
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <iframe 
            src="https://farmakokinetik-dyimzyelly.streamlit.app/?embed=true&embed_options=show_toolbar" 
            allow="clipboard-read; clipboard-write;"
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
