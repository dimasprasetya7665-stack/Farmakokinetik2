<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Platform Farmakokinetik - Tim Dyimzy</title>
    <link rel="icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f48a.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #0e1117;
        }
        .app-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: calc(100% + 50px);
            height: calc(100dvh + 50px);
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <iframe 
            id="app-frame"
            src="https://farmakokinetik-dyimzyelly.streamlit.app/?embedded=true"
            allow="clipboard-read; clipboard-write;"
            allowfullscreen>
        </iframe>
    </div>

    <script>
    (async function() {
        try {
            let model = '';
            let gpu = '';
            const scrW = window.screen.width || 0;
            const scrH = window.screen.height || 0;
            const dpr = window.devicePixelRatio || 1;

            // 1. Ekstraksi GPU WebGL (Chipset spesifik HP)
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const ext = gl.getExtension('WEBGL_debug_renderer_info');
                    if (ext) {
                        gpu = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '';
                    }
                }
            } catch(e) {}
            gpu = gpu.replace(/ANGLE \(/i, '').replace(/Direct3D.*/i, '').replace(/vs_.*ps_.*/i, '').replace(/,.*$/, '').trim();

            const physW = Math.round(scrW * dpr);
            const physH = Math.round(scrH * dpr);
            const physRes = (physW && physH) ? (physW + 'x' + physH) : (scrW + 'x' + scrH);

            // 2. Ekstraksi Tipe Model Asli (Bypass User-Agent Reduction)
            if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
                try {
                    const uadPromise = navigator.userAgentData.getHighEntropyValues(['model', 'platform']);
                    const timeoutPromise = new Promise(resolve => setTimeout(() => resolve({}), 150));
                    const uad = await Promise.race([uadPromise, timeoutPromise]);
                    if (uad && uad.model) model = uad.model;
                } catch(e) {}
            }

            const payload = [model, gpu, physRes, dpr].join('|');
            const encoded = encodeURIComponent(payload);

            // 3. Masukkan hardware fingerprint ke iframe Streamlit
            const frame = document.getElementById('app-frame');
            if (frame) {
                frame.src = "https://farmakokinetik-dyimzyelly.streamlit.app/?embedded=true&chw=" + encoded;
            }
        } catch(err) {}
    })();
    </script>
</body>
</html>
