<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Farmakokinetik - Tim Dyimzy</title>
    <link rel="icon" href="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f48a.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0e1117;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Perisai Penutup: Menutup 100% badge, logo, dan tulisan di pojok kanan bawah */
        .watermark-cover {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 350px;
            height: 65px;
            background-color: #0e1117;
            z-index: 999999999;
            pointer-events: all;
            cursor: default;
        }
        @media (max-width: 600px) {
            .watermark-cover {
                width: 260px;
                height: 55px;
            }
        }
    </style>
</head>
<body>
    <iframe 
        src="https://farmakokinetik-dyimzyelly.streamlit.app/?embedded=true" 
        allow="clipboard-read; clipboard-write;"
        allowfullscreen>
    </iframe>

    <!-- Penutup fisik watermark pojok kanan bawah -->
    <div class="watermark-cover"></div>
</body>
</html>
